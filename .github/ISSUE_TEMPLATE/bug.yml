name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: The minimal steps to trigger the bug. A markdown snippet is ideal.
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (from Settings → About) or git commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm this report contains no private text, documents, or API keys
          required: true
