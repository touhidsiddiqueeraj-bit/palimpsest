name: Feature request
description: Suggest an idea for Palimpsest
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Paste a realistic scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try?
  - type: checkboxes
    id: laws
    attributes:
      label: Product laws
      description: Every feature must uphold the product laws (file-first, local & private, diff-first, no telemetry).
      options:
        - label: I believe this fits the product laws
          required: true
