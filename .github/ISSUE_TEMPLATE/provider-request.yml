name: Provider request
description: Ask for a new AI provider adapter
labels: [ai, enhancement]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Name and vendor of the provider
    validations:
      required: true
  - type: dropdown
    id: shape
    attributes:
      label: API shape
      options:
        - OpenAI-compatible (baseUrl + key)
        - Anthropic Messages API
        - Google Generative AI
        - Native SDK (not OpenAI-compatible)
      description: Which API does it speak?
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: API docs URL
      description: Link to the API reference
  - type: checkboxes
    id: privacy
    attributes:
      label: BYOK agreement
      options:
        - label: This provider supports BYOK (no Palimpsest account needed)
          required: true
