[package]
name = "palimpsest"
version = "0.1.0"
description = "The Markdown editor with a memory"
authors = ["Palimpsest contributors"]
edition = "2021"

[lib]
name = "palimpsest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
