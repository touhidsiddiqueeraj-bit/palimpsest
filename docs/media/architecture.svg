<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="960" height="640" fill="#f7f4ee"/>
  <g font-size="13" fill="#3a3a3a">
    <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#201c16">Palimpsest — capability-layer architecture</text>

    <!-- Clients row -->
    <rect x="40" y="60" width="270" height="86" rx="8" fill="#fffdf7" stroke="#c9c2b4"/>
    <text x="175" y="84" text-anchor="middle" font-weight="bold">Desktop app (Tauri 2)</text>
    <text x="175" y="104" text-anchor="middle">React 18 + CodeMirror 6</text>
    <text x="175" y="122" text-anchor="middle">history drawer · ask-AI panel</text>

    <rect x="355" y="60" width="270" height="86" rx="8" fill="#fffdf7" stroke="#c9c2b4"/>
    <text x="490" y="84" text-anchor="middle" font-weight="bold">AI agents (MCP clients)</text>
    <text x="490" y="104" text-anchor="middle">opencode · Claude · Cursor</text>
    <text x="490" y="122" text-anchor="middle">tools: recall, milestones, restore…</text>

    <rect x="670" y="60" width="250" height="86" rx="8" fill="#fffdf7" stroke="#c9c2b4"/>
    <text x="795" y="84" text-anchor="middle" font-weight="bold">Humans</text>
    <text x="795" y="104" text-anchor="middle">keyboard-first editing</text>
    <text x="795" y="122" text-anchor="middle">milestones · renames · restore</text>

    <!-- arrows down -->
    <line x1="175" y1="146" x2="175" y2="188" stroke="#8a8272" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="490" y1="146" x2="490" y2="188" stroke="#8a8272" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="795" y1="146" x2="795" y2="188" stroke="#8a8272" stroke-width="1.5" marker-end="url(#a)"/>
    <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a8272"/></marker></defs>

    <!-- capability layer -->
    <rect x="40" y="196" width="880" height="130" rx="8" fill="#fbf3e3" stroke="#d8b46a"/>
    <text x="480" y="220" text-anchor="middle" font-weight="bold" fill="#6b4d12">packages/core — the capability layer (implemented ONCE)</text>
    <g font-size="12.5" fill="#5c4a2a">
      <rect x="70" y="236" width="190" height="70" rx="6" fill="#fffdf5" stroke="#d8b46a"/><text x="165" y="258" text-anchor="middle" font-weight="bold">diff engine</text><text x="165" y="276" text-anchor="middle">word-level, prose-aware</text><text x="165" y="292" text-anchor="middle">the primitive</text>
      <rect x="285" y="236" width="190" height="70" rx="6" fill="#fffdf5" stroke="#d8b46a"/><text x="380" y="258" text-anchor="middle" font-weight="bold">history store</text><text x="380" y="276" text-anchor="middle">snapshots · milestones</text><text x="380" y="292" text-anchor="middle">SQLite index + FTS5</text>
      <rect x="500" y="236" width="190" height="70" rx="6" fill="#fffdf5" stroke="#d8b46a"/><text x="595" y="258" text-anchor="middle" font-weight="bold">recall</text><text x="595" y="276" text-anchor="middle">context-budget aware</text><text x="595" y="292" text-anchor="middle">current / modified / deleted</text>
      <rect x="715" y="236" width="180" height="70" rx="6" fill="#fffdf5" stroke="#d8b46a"/><text x="805" y="258" text-anchor="middle" font-weight="bold">markdown renderer</text><text x="805" y="276" text-anchor="middle">GFM + callouts</text><text x="805" y="292" text-anchor="middle">fixture-golden</text>
    </g>

    <!-- arrow down -->
    <line x1="480" y1="326" x2="480" y2="368" stroke="#8a8272" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- storage -->
    <rect x="120" y="376" width="340" height="150" rx="8" fill="#eef4ee" stroke="#7fa07f"/>
    <text x="290" y="400" text-anchor="middle" font-weight="bold" fill="#2c4a2c">File-first truth (.md on disk)</text>
    <text x="290" y="424" text-anchor="middle" font-size="12.5">.palimpsest/snapshots/*.md</text>
    <text x="290" y="442" text-anchor="middle" font-size="12.5">immutable, YAML frontmatter</text>
    <text x="290" y="460" text-anchor="middle" font-size="12.5">.palimpsest/archive/ (pruned)</text>
    <text x="290" y="494" text-anchor="middle" font-size="11" fill="#556b55">no database-as-truth · a plain git repo of .md files</text>

    <rect x="500" y="376" width="340" height="150" rx="8" fill="#eef4ee" stroke="#7fa07f"/>
    <text x="670" y="400" text-anchor="middle" font-weight="bold" fill="#2c4a2c">Derived index (SQLite + FTS5)</text>
    <text x="670" y="424" text-anchor="middle" font-size="12.5">.palimpsest/index.db</text>
    <text x="670" y="442" text-anchor="middle" font-size="12.5">rebuildable via reindex()</text>
    <text x="670" y="460" text-anchor="middle" font-size="12.5">word diffs of every snapshot</text>
    <text x="670" y="494" text-anchor="middle" font-size="11" fill="#556b55">the md files are the source of truth</text>

    <!-- AI BYOK box -->
    <rect x="40" y="556" width="880" height="64" rx="8" fill="#f3eefa" stroke="#9a86c9"/>
    <text x="480" y="580" text-anchor="middle" font-weight="bold" fill="#4a3a7a">packages/ai — BYOK, offline-first (Ollama / LM Studio / OpenAI-compatible)</text>
    <text x="480" y="602" text-anchor="middle" font-size="12.5">AI proposes → word-diff preview → explicit accept/reject → auto-milestone records model + instruction</text>
  </g>
</svg>